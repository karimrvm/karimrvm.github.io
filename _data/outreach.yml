full: |-
  Since [Náboj](https://math.naboj.org/gb/en/) came to Hamburg in 2024, I have been
  closely involved in establishing the event locally and have served as its main
  organizer. Náboj is an international mathematics competition in which teams of up
  to five high-school students work together for two hours to solve as many challenging
  problems of increasing difficulty as possible. The format emphasizes mathematical
  creativity, logical reasoning, and teamwork.

  The Hamburg event has grown from 19 teams and around 100 students in 2024 to 38 teams
  and 170 students in 2026. We hope to build on this success and see the event continue
  to grow in the years ahead.

  Reports from the University of Hamburg: [2024](https://www.min.uni-hamburg.de/ueber-die-fakultaet/aktuelles/2024/0424-mathewettbewerb-naboj.html) · [2025](https://www.min.uni-hamburg.de/ueber-die-fakultaet/aktuelles/2025/0317-mathewettbewerb-naboj.html) · [2026](https://www.min.uni-hamburg.de/en/ueber-die-fakultaet/aktuelles/2026/0316-mathewettbewerb-naboj.html)
